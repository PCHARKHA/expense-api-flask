<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Expenses | Personal Finance Manager</title>

  <!-- Google Font: Manrope, kept consistent with the other pages -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/all_expenses.css') }}">
</head>
<body>

  <!-- ==========================================================
       NAVIGATION
       ========================================================== -->
  <nav class="site-nav">
    <a href="{{ url_for('home') }}" class="nav-link">Home</a>
    <a href="{{ url_for('dashboard_page') }}" class="nav-link">Dashboard</a>
  </nav>

  <main class="all-expenses-wrapper">

    <!-- ==========================================================
         PAGE HEADING
         ========================================================== -->
    <header class="page-header">
      <h1 class="page-heading">All Expenses</h1>
      <p class="page-subtitle">View and manage all your recorded expenses.</p>
    </header>

    <!-- ==========================================================
         FILTER SECTION
         ========================================================== -->
    <section class="filter-section" aria-label="Filter expenses">
      <label for="category-filter" class="filter-label">Filter by Category</label>
      <select id="category-filter" name="category-filter" class="category-filter">
        <option value="all">All Categories</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Groceries">Groceries</option>
        <option value="Shopping">Shopping</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Bills">Bills</option>
        <option value="Gifts">Gifts</option>
        <option value="Health">Health</option>
        <option value="Rent">Rent</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>
    </section>

    <!-- ==========================================================
         EXPENSES LIST
         ==========================================================
         This container starts empty. Expense items will be added
         here dynamically with JavaScript once the Flask backend
         is connected. -->
    <section class="expenses-section" aria-label="Expense list">
      <div id="action-message" class="action-message"></div>
      
      <div id="all-expenses-list" class="all-expenses-list">
        <!-- Expense items will be inserted here by JavaScript -->
      </div>

      <!-- ==========================================================
           EMPTY STATE
           ==========================================================
           Hidden/shown by JavaScript depending on whether there are
           expenses to display. -->
      <div id="empty-state" class="empty-state">
        <p class="empty-state-message">No expenses found.</p>
      </div>
    </section>

  </main>

  <script type ="module" src="{{ url_for('static', filename='js/all_expenses.js') }}"></script>
</body>
</html>
