<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense | Personal Finance Manager</title>

  <!-- Google Font: Manrope (clean, modern, works well for numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>


  <main class="page-wrapper">

    <div class="expense-card">

      <!-- Page heading -->
      <header class="expense-header">
        <h1 class="expense-title">Add Expense</h1>
        <p class="expense-subtitle">Log a new transaction to keep your budget on track</p>
      </header>

      <!-- Main form: no action/method wired up yet, backend comes later -->
      <form id="expense-form" class="expense-form">

        <!-- AMOUNT SECTION -->
        <!-- Shows the amount being entered on the custom keypad below -->
        <section class="amount-section" aria-label="Expense amount">
          <div id="amount-display" class="amount-display">
            <span class="currency-symbol">₹</span>
            <span id="amount-value" class="amount-value">0</span>
          </div>

          <!-- Custom numeric keypad (UI only, no functionality yet) -->
          <div id="numeric-keypad" class="numeric-keypad" role="group" aria-label="Custom number pad">
            <button type="button" class="keypad-key" data-key="1">1</button>
            <button type="button" class="keypad-key" data-key="2">2</button>
            <button type="button" class="keypad-key" data-key="3">3</button>

            <button type="button" class="keypad-key" data-key="4">4</button>
            <button type="button" class="keypad-key" data-key="5">5</button>
            <button type="button" class="keypad-key" data-key="6">6</button>

            <button type="button" class="keypad-key" data-key="7">7</button>
            <button type="button" class="keypad-key" data-key="8">8</button>
            <button type="button" class="keypad-key" data-key="9">9</button>

            <button type="button" class="keypad-key keypad-decimal" data-key=".">.</button>
            <button type="button" class="keypad-key" data-key="0">0</button>
            <button type="button" class="keypad-key keypad-clear" data-key="clear" aria-label="Clear amount">⌫</button>
          </div>
        </section>

        <!-- CATEGORY SECTION -->
        <section class="form-group category-group">
          <label for="category-select" class="form-label">Category</label>
          <select id="category-select" name="category" class="category-select">
            <option value="" disabled selected>Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Groceries">Groceries</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Gifts">Gifts</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Rent">Rent</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </section>

        <!-- NOTE SECTION -->
        <section class="form-group note-group">
          <label for="expense-note" class="form-label">
            Note <span class="label-optional">(optional)</span>
          </label>
          <textarea
            id="expense-note"
            name="note"
            class="expense-note"
            rows="2"
            placeholder="e.g. Dinner with friends"
          ></textarea>
        </section>

        <div id="form-message" class="form-message"></div>

        <!-- SUBMIT -->
        <button type="submit" id="submit-expense-btn" class="submit-expense-btn">
          Add Expense
        </button>

      </form>

    </div>

  </main>
  <script src="{{ url_for('static', filename='js/add_expense.js') }}"></script>

</body>
</html>
